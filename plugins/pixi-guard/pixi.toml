# Dev runtime for pixi-guard's tests. The plugin itself needs neither pixi nor
# Python: its hook is POSIX sh + awk, so it can tell a user that pixi is missing.
[workspace]
name = "pixi-guard"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
# Latest only: the pixi that made pixi.lock (the newest then), no upper bound;
# an older pixi refuses the manifest. Moved with every relock (the suite
# checks it).
requires-pixi = ">=0.83.0"

[dependencies]
python = "*"

[tasks]
test = "python tests/run_tests.py"
test-matrix = "python tests/run_tests.py --matrix"
